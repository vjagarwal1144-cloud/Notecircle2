name: Android CI & APK Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Validate Android project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f "settings.gradle.kts" || { echo "::error::settings.gradle.kts missing"; exit 1; }
          test -f "build.gradle.kts" || { echo "::error::build.gradle.kts missing"; exit 1; }
          test -f "app/build.gradle.kts" || { echo "::error::app/build.gradle.kts missing"; exit 1; }
          test -f "app/src/main/AndroidManifest.xml" || { echo "::error::AndroidManifest.xml missing"; exit 1; }
          echo "Android project structure verified."

      - name: Create CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f "debug.keystore"
          echo "CI debug signing keystore is ready."

      # Build and upload the APK before tests so a test-only failure cannot hide a usable APK.
      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify & Checksum APK
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK not found in app/build/outputs/apk/debug"
            exit 1
          fi
          FILE_SIZE="$(stat -c%s "$APK_PATH")"
          if [ "$FILE_SIZE" -le 1000 ]; then
            echo "::error::Debug APK is empty or unexpectedly small ($FILE_SIZE bytes)"
            exit 1
          fi
          CHECKSUM="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          echo "APK found: $APK_PATH ($FILE_SIZE bytes)"
          echo "SHA-256: $CHECKSUM"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "apk_size=$FILE_SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notecircle-debug-apk
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Report APK details
        if: always()
        shell: bash
        run: |
          {
            echo "## NoteCircle Android Debug APK"
            echo ""
            echo "- APK build step: ${{ steps.verify_apk.outcome || 'not completed' }}"
            echo "- APK path: ${{ steps.verify_apk.outputs.apk_path || 'not available' }}"
            echo "- Size (bytes): ${{ steps.verify_apk.outputs.apk_size || 'not available' }}"
            echo "- SHA-256: ${{ steps.verify_apk.outputs.apk_checksum || 'not available' }}"
            echo ""
            echo "Download the `notecircle-debug-apk` artifact from this workflow run when it is available."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Reports & Diagnostics
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: build-test-diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
            build/reports/
          if-no-files-found: warn
          retention-days: 7
